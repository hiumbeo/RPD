name: RDP

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime (max 350)"
        required: false
        default: "350"

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RDP_USER: ProUser
      RDP_PASS: ProRdp@2025!

    steps:
      # 1. BẬT RDP
      - name: Enable RDP
        run: |
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1
          $sec = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RDP_USER -EA SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USER -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER
          } else {
            Set-LocalUser -Name $env:RDP_USER -Password $sec
          }
          Write-Host "RDP ready."

      # 2. DOWNLOAD LOCALTONET (tunnel ổn định nhất)
      - name: Download localtonet
        run: |
          New-Item -ItemType Directory -Path "C:\Tools" -Force | Out-Null
          Invoke-WebRequest https://localtonet.com/download/localtonet-win-64.zip -OutFile "$env:TEMP\lt.zip"
          Expand-Archive "$env:TEMP\lt.zip" -DestinationPath "C:\Tools" -Force
          Get-ChildItem "C:\Tools"

      # 3. START LOCALTONET TUNNEL
      - name: Start tunnel
        run: |
          $token = "${{ secrets.LOCALTONET_TOKEN }}".Trim()
          if ($token.Length -eq 0) {
            Write-Host "Chưa có LOCALTONET_TOKEN, dùng bore.pub fallback"
            Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip -OutFile bore.zip
            Expand-Archive bore.zip -DestinationPath . -Force
            Start-Process -FilePath "$PWD\bore.exe" `
              -ArgumentList "local","3389","--to","bore.pub:7835" `
              -RedirectStandardOutput "$PWD\bore.log" `
              -RedirectStandardError "$PWD\bore.err" `
              -NoNewWindow
            Start-Sleep -Seconds 15
            Write-Host "===== BORE LOG ====="
            Get-Content "$PWD\bore.log" -EA SilentlyContinue
            Get-Content "$PWD\bore.err" -EA SilentlyContinue
          } else {
            Start-Process -FilePath "C:\Tools\localtonet.exe" -ArgumentList "--authtoken",$token -WindowStyle Hidden
            Start-Sleep -Seconds 20
            Write-Host "===== LOCALTONET RUNNING ====="
            Write-Host "Vô localtonet.com dashboard → xem tunnel URL"
            Write-Host "Hoặc tải file connection-info.txt trên repo"
          }
          Write-Host "User: $env:RDP_USER"
          Write-Host "Pass: $env:RDP_PASS"

      # 4. LƯU THÔNG TIN KẾT NỐI LÊN REPO
      - name: Save connection info
        run: |
          $info = "User: $env:RDP_USER`nPass: $env:RDP_PASS`nRuntime: ${{ inputs.runtime_minutes }} min"
          $info | Out-File -Encoding utf8 "connection-info.txt"
          Write-Host $info

      - name: Commit info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("connection-info.txt"))
          $body = @{ message="update info"; content=$content; branch="${{ github.ref_name }}" } | ConvertTo-Json
          $hdr = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/contents/connection-info.txt"
          try {
            $existing = Invoke-RestMethod -Uri "$uri`?ref=${{ github.ref_name }}" -Headers $hdr -EA SilentlyContinue
            if ($existing.sha) {
              $body = @{ message="update info"; content=$content; sha=$existing.sha; branch="${{ github.ref_name }}" } | ConvertTo-Json
            }
          } catch {}
          try {
            Invoke-RestMethod -Method PUT -Uri $uri -Headers $hdr -Body $body -ContentType "application/json" | Out-Null
            Write-Host "Info saved to repo!"
          } catch {
            Write-Host "Save failed: $($_.Exception.Message)"
          }

      # 5. KEEP ALIVE
      - name: Keep alive
        run: |
          $mins = [int]"${{ inputs.runtime_minutes }}"
          if ($mins -gt 350) { $mins = 350 }
          $end = (Get-Date).AddMinutes($mins)
          $i = 0
          while ((Get-Date) -lt $end) {
            $i++
            $remaining = ($end - (Get-Date)).ToString('hh\:mm\:ss')
            Write-Host "Heartbeat #$i | Remaining: $remaining"
            Start-Sleep -Seconds 60
          }
