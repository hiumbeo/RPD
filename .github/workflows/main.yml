name: RDP

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime (max 350)"
        required: false
        default: "350"

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RDP_USER: ProUser
      RDP_PASS: ProRdp@2025!

    steps:
      # ─────────────────────────────────────────
      # 1. BẬT RDP + TẠO USER
      # ─────────────────────────────────────────
      - name: Enable RDP
        run: |
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1

          $sec = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RDP_USER -EA SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USER -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER
          } else {
            Set-LocalUser -Name $env:RDP_USER -Password $sec
          }
          Write-Host "RDP ready. user=$env:RDP_USER"

      # ─────────────────────────────────────────
      # 2. DOWNLOAD BORE
      # ─────────────────────────────────────────
      - name: Download bore
        run: |
          Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath . -Force

      # ─────────────────────────────────────────
      # 3. START TUNNEL
      # ─────────────────────────────────────────
      - name: Start tunnel
        run: |
          $log = "$PWD\bore_out.log"
          $err = "$PWD\bore_err.log"
          $proc = Start-Process -FilePath "$PWD\bore.exe" `
            -ArgumentList "local","3389","--to","bore.pub" `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err `
            -NoNewWindow -PassThru
          Write-Host "bore PID: $($proc.Id)"
          Start-Sleep -Seconds 12
          Write-Host "===== STDOUT ====="
          if (Test-Path $log) { Get-Content $log }
          Write-Host "===== STDERR ====="
          if (Test-Path $err) { Get-Content $err }
          Write-Host "=================="
          Write-Host "User: $env:RDP_USER"
          Write-Host "Pass: $env:RDP_PASS"
          Write-Host "Tìm dòng 'listening at bore.pub:XXXXX' ở trên"
          Write-Host "Địa chỉ RDP = bore.pub:XXXXX"
          Write-Host "=================="

      # ─────────────────────────────────────────
      # 4. KEEP ALIVE
      # ─────────────────────────────────────────
      - name: Keep alive
        run: |
          $mins = [int]"${{ inputs.runtime_minutes }}"
          if ($mins -gt 350) { $mins = 350 }
          $end = (Get-Date).AddMinutes($mins)
          $i = 0
          while ((Get-Date) -lt $end) {
            $i++
            $remaining = ($end - (Get-Date)).ToString('hh\:mm\:ss')
            Write-Host "Heartbeat #$i | Remaining: $remaining"
            Start-Sleep -Seconds 60
          }
          Write-Host "Runtime done."
